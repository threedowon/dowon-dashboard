[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; Same conservative S3 / CH343 profile as SEN0610-Tester.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = dio
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
upload_speed = 115200
; Select the actual CH343 port. Do not assume COM20 is still the right device.
; upload_port = COM20
; monitor_port = COM20
