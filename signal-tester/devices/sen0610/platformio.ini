[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
; Conservative settings until the exact S3 module is identified.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = dio
; COM20 is a CH343 USB-UART bridge; use UART0 for Serial output.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    https://github.com/DFRobot/DFRobot_C4001.git#0ffb02cca9f3c8cd19ae85a0c65a3ee566a06ab8
; Change these if Windows assigns another COM port.
; upload_port = COM20
; monitor_port = COM20

