<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <!-- Separate scales keep this looking like paper rather than digital noise. -->
    <filter id="pulp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".027 .043" numOctaves="3" stitchTiles="stitch" seed="18"/>
      <feColorMatrix values="0 0 0 0 .40  0 0 0 0 .25  0 0 0 0 .10  1.8 0 0 0 -.67"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".74" numOctaves="3" stitchTiles="stitch" seed="7"/>
      <feColorMatrix values="0 0 0 0 .27  0 0 0 0 .19  0 0 0 0 .10  3.5 0 0 0 -1.43"/>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".10 .62" numOctaves="2" stitchTiles="stitch" seed="32"/>
      <feColorMatrix values="0 0 0 0 .99  0 0 0 0 .92  0 0 0 0 .75  4.5 0 0 0 -2.05"/>
    </filter>
    <filter id="ink-edge" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".055 .16" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <path d="M0 0h480v480H0z" filter="url(#pulp)" opacity=".22"/>
  <path d="M0 0h480v480H0z" filter="url(#grain)" opacity=".35"/>
  <path d="M0 0h480v480H0z" filter="url(#fibers)" opacity=".20"/>
</svg>
